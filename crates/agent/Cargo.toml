[package]
name = "wp-agent"
description = "Node agent that performs privileged WordPress hosting operations for WP Panel"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wp-agent"
path = "src/main.rs"

[dependencies]
wp-common = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { workspace = true }

rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
# default features pull in aws-lc-rs, which puts two crypto providers in the
# rustls graph and breaks automatic provider selection at runtime.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }

serde = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

chrono = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hostname = "0.4"
