<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ code }} {{ title }} · WP Panel</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<main class="auth">
  <div class="auth-card" style="text-align:center">
    <div class="brand" style="justify-content:center">
      <span class="brand-mark" aria-hidden="true">WP</span>
      <span>WP Panel</span>
    </div>
    <h1 style="font-size:2.2rem;margin:.5rem 0">{{ code }}</h1>
    <h2 class="dim">{{ title }}</h2>
    <p class="muted mt">{{ message }}</p>
    <a class="btn mt" href="/">Back to overview</a>
  </div>
</main>
</body>
</html>
