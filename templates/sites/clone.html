{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto py-8 px-4">
  <h1 class="text-2xl font-bold mb-6">Clone Site</h1>
  <p class="text-gray-600 mb-4">Clone <strong>{{ site.site.domain }}</strong> to a new site on the same server.</p>

  <form method="post" action="/sites/{{ site.site.id }}/clone" class="bg-white rounded-lg shadow p-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ chrome.csrf_token }}">

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Target Domain</label>
      <input type="text" name="target_domain" required
             class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
             placeholder="copy.example.com">
      <p class="text-xs text-gray-500 mt-1">The domain for the cloned site.</p>
    </div>

    <div class="flex items-center">
      <input type="checkbox" name="request_ssl" value="true" id="request_ssl"
             class="h-4 w-4 text-blue-600 rounded border-gray-300">
      <label for="request_ssl" class="ml-2 text-sm text-gray-700">Request SSL certificate</label>
    </div>

    <div class="flex justify-end space-x-3 pt-4">
      <a href="/sites/{{ site.site.id }}" class="px-4 py-2 border border-gray-300 rounded hover:bg-gray-50">Cancel</a>
      <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Clone Site</button>
    </div>
  </form>
</div>
{% endblock %}
