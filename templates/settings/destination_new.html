{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto py-8 px-4">
  <h1 class="text-2xl font-bold mb-6">Add Backup Destination</h1>

  <form method="post" action="/settings/destinations" class="bg-white rounded-lg shadow p-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ chrome.csrf_token }}">

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
      <input type="text" name="name" required
             class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
             placeholder="My S3 Backup">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Provider</label>
      <select name="provider"
              class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="s3">AWS S3</option>
        <option value="r2">Cloudflare R2</option>
        <option value="b2">Backblaze B2</option>
        <option value="wasabi">Wasabi</option>
        <option value="minio">MinIO</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Bucket</label>
      <input type="text" name="bucket" required
             class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
             placeholder="my-wp-backups">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Region</label>
        <input type="text" name="region"
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="us-east-1">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Endpoint (optional)</label>
        <input type="text" name="endpoint"
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="https://s3.amazonaws.com">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Access Key ID</label>
      <input type="text" name="access_key_id"
             class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
             placeholder="AKIAIOSFODNN7EXAMPLE">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Secret Access Key</label>
      <input type="password" name="secret"
             class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
             placeholder="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Restic Repository Password</label>
      <input type="password" name="restic_password"
             class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
             placeholder="Encryption password for restic backups">
    </div>

    <div class="flex justify-end space-x-3 pt-4">
      <a href="/settings/destinations" class="px-4 py-2 border border-gray-300 rounded hover:bg-gray-50">Cancel</a>
      <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Create Destination</button>
    </div>
  </form>
</div>
{% endblock %}
