<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your account — WP Panel</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-page">
  <main class="login-box">
    <h1>Create your account</h1>
    <p class="muted">You've been invited as <strong>{{ role }}</strong>.</p>

    {% if let Some(error) = error %}
    <div class="banner bad">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register">
      <input type="hidden" name="token" value="{{ token }}">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" value="{{ email }}" disabled>
      </div>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required autocomplete="name" placeholder="Your name">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password"
               placeholder="At least 8 characters" minlength="8">
      </div>
      <button class="btn primary block" type="submit">Create account</button>
    </form>

    <p class="muted mt" style="text-align:center">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </main>
</body>
</html>
