<aside class="sidebar" id="sidebar">
  <a class="brand" href="/">
    <span class="brand-mark" aria-hidden="true">WP</span>
    <span>WP Panel<small>control plane</small></span>
  </a>

  <nav class="nav" aria-label="Main">
    <a href="/" {% if chrome.section == "dashboard" %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 8h6V4h-6z"/></svg>
      Overview
    </a>
    <a href="/sites" {% if chrome.section == "sites" %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18 15 15 0 010-18z"/></svg>
      Sites
    </a>
    <a href="/servers" {% if chrome.section == "servers" %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>
      Servers
    </a>
    <a href="/jobs" {% if chrome.section == "jobs" %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg>
      Jobs
      {% if chrome.active_jobs > 0 %}<span class="count">{{ chrome.active_jobs }}</span>{% endif %}
    </a>

    <span class="nav-label">Account</span>
    <a href="/audit" {% if chrome.section == "audit" %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h4"/></svg>
      Audit log
    </a>
    <a href="/settings" {% if chrome.section == "settings" %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a7.9 7.9 0 000-6l1.5-2.1-2.1-2.1L16.7 6.3a7.9 7.9 0 00-2.6-1.1L13.5 3h-3l-.6 2.2a7.9 7.9 0 00-2.6 1.1L5.2 4.8 3.1 6.9 4.6 9a7.9 7.9 0 000 6l-1.5 2.1 2.1 2.1 2.1-1.5a7.9 7.9 0 002.6 1.1l.6 2.2h3l.6-2.2a7.9 7.9 0 002.6-1.1l2.1 1.5 2.1-2.1z"/></svg>
      Settings
    </a>
  </nav>

  <div class="sidebar-footer">
    <a class="btn sm" href="/sites/new">New site</a>
    <form method="post" action="/logout">
      <button class="btn ghost sm" type="submit">Sign out {{ chrome.user_name }}</button>
    </form>
  </div>
</aside>
