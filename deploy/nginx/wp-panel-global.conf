# Managed by wp-panel: global bits every site vhost depends on.
# Install to /etc/nginx/conf.d/wp-panel-global.conf

# Login brute-force protection, referenced by each vhost's /wp-login.php block.
limit_req_zone $binary_remote_addr zone=wp_login:10m rate=6r/m;

# Shared connection limits.
limit_conn_zone $binary_remote_addr zone=wp_conn:10m;

# ACME webroot for Let's Encrypt HTTP-01 challenges.
# The agent points certbot --webroot-path here.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 444;
    }
}

# Real client IP when the panel sits behind a load balancer or Cloudflare.
